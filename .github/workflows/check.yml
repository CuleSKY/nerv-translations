# Checks the names and the format of the translation files on every pull
# request and every push to main, against the JSON Schemas in schemas/,
# which NERV generates. After a merge the site checks the whole repository
# again and takes the merge only when every file passes.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the validator
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r .github/check-requirements.txt
      - name: Check the file names
        shell: bash
        run: |
          status=0
          while IFS= read -r -d '' file; do
            name=${file#servers/}
            if [[ -L $file ]]; then
              echo "::error file=$file::a naming file must be a regular file, not a link"
              status=1
            elif [[ ! $name =~ ^[a-z0-9][a-z0-9-]{0,31}\.json$ ]]; then
              echo "::error file=$file::a naming file is servers/<community>.json, <community> being the community's ID: lower-case letters, digits and hyphens, directly under servers/"
              status=1
            fi
          done < <(find servers \( -type f -o -type l \) -name '*.json' -print0 2>/dev/null)
          # maps/ holds only the tag dictionary and one map-name file per
          # game, named by the game's Steam AppID (a 32-bit number).
          while IFS= read -r -d '' file; do
            if [[ -L $file ]]; then
              echo "::error file=$file::a map file must be a regular file, not a link"
              status=1
            elif [[ $file == maps/tags.json ]]; then
              continue
            elif [[ ! $file =~ ^maps/names/([1-9][0-9]{0,9})\.json$ ]] || (( BASH_REMATCH[1] > 4294967295 )); then
              echo "::error file=$file::maps/ holds only maps/tags.json and maps/names/<game>.json, <game> being the game's Steam AppID in digits, such as 730 for CS2, directly under maps/names/"
              status=1
            fi
          done < <(find maps \( -type f -o -type l \) -print0 2>/dev/null)
          exit $status
      # The site reads the files as strict JSON: UTF-8 without a byte order
      # mark, no key repeated in an object. The schema checks below read
      # them more leniently, so this is checked first.
      - name: Check the JSON
        shell: bash
        run: |
          mapfile -d '' files < <(find servers maps/names maps/tags.json -maxdepth 1 -type f -name '*.json' -print0 2>/dev/null | sort -z)
          if (( ${#files[@]} == 0 )); then
            exit 0
          fi
          python - "${files[@]}" <<'PY'
          import json
          import sys

          def unique(pairs):
              seen = set()
              for key, _ in pairs:
                  if key in seen:
                      raise ValueError(f"the key {key!r} is repeated in an object")
                  seen.add(key)
              return dict(pairs)

          status = 0
          for name in sys.argv[1:]:
              with open(name, "rb") as f:
                  raw = f.read()
              try:
                  if raw.startswith(b"\xef\xbb\xbf"):
                      raise ValueError("the file starts with a byte order mark")
                  json.loads(raw.decode("utf-8"), object_pairs_hook=unique)
              except ValueError as e:
                  print(f"::error file={name}::{e}")
                  status = 1
          sys.exit(status)
          PY
      - name: Check the server naming files
        shell: bash
        run: |
          mapfile -d '' files < <(find servers -maxdepth 1 -type f -name '*.json' -print0 2>/dev/null | sort -z)
          if (( ${#files[@]} == 0 )); then
            echo "No naming file."
            exit 0
          fi
          check-jsonschema --schemafile schemas/servers.schema.json "${files[@]}"
      - name: Check the map files
        shell: bash
        run: |
          status=0
          mapfile -d '' files < <(find maps/names -maxdepth 1 -type f -name '*.json' -print0 2>/dev/null | sort -z)
          if (( ${#files[@]} == 0 )); then
            echo "No map-name file."
          else
            check-jsonschema --schemafile schemas/map-names.schema.json "${files[@]}" || status=1
          fi
          if [[ -f maps/tags.json && ! -L maps/tags.json ]]; then
            check-jsonschema --schemafile schemas/map-tags.schema.json maps/tags.json || status=1
          else
            echo "No tag dictionary."
          fi
          exit $status
