# Checks the names and the format of the translation files on every pull
# request and every push to main, against the JSON Schemas in schemas/,
# which NERV generates. After a merge the site checks the whole repository
# again and takes the merge only when every file passes. The reminder texts
# are not taken at a merge: NERV's backend takes them, and checks them
# again, when it is released.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the validator
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r .github/check-requirements.txt
      - name: Check the file names
        shell: bash
        run: |
          status=0
          while IFS= read -r -d '' file; do
            name=${file#servers/}
            if [[ -L $file ]]; then
              echo "::error file=$file::a naming file must be a regular file, not a link"
              status=1
            elif [[ ! $name =~ ^[a-z0-9][a-z0-9-]{0,31}\.json$ ]]; then
              echo "::error file=$file::a naming file is servers/<community>.json, <community> being the community's ID: lower-case letters, digits and hyphens, directly under servers/"
              status=1
            fi
          done < <(find servers \( -type f -o -type l \) -name '*.json' -print0 2>/dev/null)
          if [[ -L server-labels.json ]]; then
            echo "::error file=server-labels.json::the server label dictionary must be a regular file, not a link"
            status=1
          fi
          # maps/ holds only the tag dictionary and one map-name file per
          # game, named by the game's Steam AppID (a 32-bit number).
          while IFS= read -r -d '' file; do
            if [[ -L $file ]]; then
              echo "::error file=$file::a map file must be a regular file, not a link"
              status=1
            elif [[ $file == maps/tags.json ]]; then
              continue
            elif [[ ! $file =~ ^maps/names/([1-9][0-9]{0,9})\.json$ ]] || (( BASH_REMATCH[1] > 4294967295 )); then
              echo "::error file=$file::maps/ holds only maps/tags.json and maps/names/<game>.json, <game> being the game's Steam AppID in digits, such as 730 for CS2, directly under maps/names/"
              status=1
            fi
          done < <(find maps \( -type f -o -type l \) -print0 2>/dev/null)
          # search/ holds only one alias file per game, named by the game's
          # Steam AppID like the map-name files.
          while IFS= read -r -d '' file; do
            if [[ -L $file ]]; then
              echo "::error file=$file::a search file must be a regular file, not a link"
              status=1
            elif [[ ! $file =~ ^search/aliases/([1-9][0-9]{0,9})\.json$ ]] || (( BASH_REMATCH[1] > 4294967295 )); then
              echo "::error file=$file::search/ holds only search/aliases/<game>.json, <game> being the game's Steam AppID in digits, such as 730 for CS2, directly under search/aliases/"
              status=1
            fi
          done < <(find search \( -type f -o -type l \) -print0 2>/dev/null)
          # reminders/ holds only the reminder texts of each language.
          # English is required: a text another language leaves out shows
          # in English.
          while IFS= read -r -d '' file; do
            if [[ -L $file ]]; then
              echo "::error file=$file::a reminder file must be a regular file, not a link"
              status=1
            elif [[ ! $file =~ ^reminders/(en|zh-CN|ja|ko)\.json$ ]]; then
              echo "::error file=$file::reminders/ holds only reminders/<language>.json, <language> being en, zh-CN, ja or ko (Traditional Chinese is converted from zh-CN), directly under reminders/"
              status=1
            fi
          done < <(find reminders \( -type f -o -type l \) -print0 2>/dev/null)
          if [[ ! -f reminders/en.json ]]; then
            echo "::error file=reminders/en.json::reminders/en.json is required: English has every reminder text"
            status=1
          fi
          exit $status
      # The site reads the files as strict JSON: UTF-8 without a byte order
      # mark, no key repeated in an object. The schema checks below read
      # them more leniently, so this is checked first.
      - name: Check the JSON
        shell: bash
        run: |
          mapfile -d '' files < <(find servers server-labels.json maps/names maps/tags.json search/aliases reminders -maxdepth 1 -type f -name '*.json' -print0 2>/dev/null | sort -z)
          if (( ${#files[@]} == 0 )); then
            exit 0
          fi
          python - "${files[@]}" <<'PY'
          import json
          import sys

          def unique(pairs):
              seen = set()
              for key, _ in pairs:
                  if key in seen:
                      raise ValueError(f"the key {key!r} is repeated in an object")
                  seen.add(key)
              return dict(pairs)

          status = 0
          for name in sys.argv[1:]:
              with open(name, "rb") as f:
                  raw = f.read()
              try:
                  if raw.startswith(b"\xef\xbb\xbf"):
                      raise ValueError("the file starts with a byte order mark")
                  json.loads(raw.decode("utf-8"), object_pairs_hook=unique)
              except ValueError as e:
                  print(f"::error file={name}::{e}")
                  status = 1
          sys.exit(status)
          PY
      # The labels the naming rules give must be in the label dictionary;
      # the site checks that after a merge.
      - name: Check the server naming files
        shell: bash
        run: |
          status=0
          mapfile -d '' files < <(find servers -maxdepth 1 -type f -name '*.json' -print0 2>/dev/null | sort -z)
          if (( ${#files[@]} == 0 )); then
            echo "No naming file."
          else
            check-jsonschema --schemafile schemas/servers.schema.json "${files[@]}" || status=1
          fi
          if [[ -f server-labels.json && ! -L server-labels.json ]]; then
            check-jsonschema --schemafile schemas/server-labels.schema.json server-labels.json || status=1
          else
            echo "No server label dictionary."
          fi
          exit $status
      - name: Check the map files
        shell: bash
        run: |
          status=0
          mapfile -d '' files < <(find maps/names -maxdepth 1 -type f -name '*.json' -print0 2>/dev/null | sort -z)
          if (( ${#files[@]} == 0 )); then
            echo "No map-name file."
          else
            check-jsonschema --schemafile schemas/map-names.schema.json "${files[@]}" || status=1
          fi
          if [[ -f maps/tags.json && ! -L maps/tags.json ]]; then
            check-jsonschema --schemafile schemas/map-tags.schema.json maps/tags.json || status=1
          else
            echo "No tag dictionary."
          fi
          exit $status
      - name: Check the search aliases
        shell: bash
        run: |
          mapfile -d '' files < <(find search/aliases -maxdepth 1 -type f -name '*.json' -print0 2>/dev/null | sort -z)
          if (( ${#files[@]} == 0 )); then
            echo "No alias file."
            exit 0
          fi
          check-jsonschema --schemafile schemas/search-aliases.schema.json "${files[@]}"
      # English has every text and each other language may leave texts out;
      # both schemas check that a text uses each of its variables and no
      # other. The backend's release checks the files again.
      - name: Check the reminder texts
        shell: bash
        run: |
          status=0
          check-jsonschema --schemafile schemas/reminder-texts-en.schema.json reminders/en.json || status=1
          mapfile -d '' files < <(find reminders -maxdepth 1 -type f -name '*.json' ! -name en.json -print0 2>/dev/null | sort -z)
          if (( ${#files[@]} > 0 )); then
            check-jsonschema --schemafile schemas/reminder-texts.schema.json "${files[@]}" || status=1
          fi
          exit $status
