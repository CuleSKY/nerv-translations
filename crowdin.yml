# The translation project (Crowdin, nerv-cs2ze-translation): which files are its sources and where its translations go.
# Simplified Chinese is the source language; English, Japanese, Korean and Traditional Chinese are translated there.
# The token is read from CROWDIN_PERSONAL_TOKEN, which only the workflows have (repository secret).
#
# Sources are under i18n/zh-CN/ (generated by tools/sync-sources.mjs from the files maintainers edit, except
# hant-phrases.json) and translations come back to i18n/<language>/ in the same paths, as approved translations only.
# tools/test/groups.test.mjs keeps this file and tools/lib/groups.mjs in agreement.
#
# What a changed source does to a translation (update_option):
# - update_as_unapproved (interface text): the translation stays, its approval goes, and it is approved again.
# - update_without_changes (names): the translation and its approval stay, so a maintainer's small fix of the
#   Simplified name does not send every language back to the original name.
project_id: "942667"
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: "."
base_url: "https://api.crowdin.com"
preserve_hierarchy: true

files:
  - source: /i18n/zh-CN/servers/*.json
    translation: /i18n/%two_letters_code%/servers/%original_file_name%
    languages_mapping: &languages
      two_letters_code:
        zh-TW: zh-TW
    update_option: update_without_changes
    labels: [names-servers]

  - source: /i18n/zh-CN/server-labels.json
    translation: /i18n/%two_letters_code%/server-labels.json
    languages_mapping: *languages
    update_option: update_without_changes
    labels: [server-labels]

  - source: /i18n/zh-CN/maps/tags.json
    translation: /i18n/%two_letters_code%/maps/tags.json
    languages_mapping: *languages
    update_option: update_without_changes
    labels: [map-tags]

  - source: /i18n/zh-CN/maps/names/*.json
    translation: /i18n/%two_letters_code%/maps/names/%original_file_name%
    languages_mapping: *languages
    update_option: update_without_changes
    labels: [names-maps]

  # Traditional Chinese reminders are converted from Simplified at the page, so they are not translated here.
  - source: /i18n/zh-CN/reminders.json
    translation: /i18n/%two_letters_code%/reminders.json
    languages_mapping: *languages
    update_option: update_as_unapproved
    excluded_target_languages: [zh-TW]
    labels: [reminders]

  # The phrase corrections the names' Traditional conversion takes: Traditional Chinese only.
  - source: /i18n/zh-CN/hant-phrases.json
    translation: /i18n/%two_letters_code%/hant-phrases.json
    languages_mapping: *languages
    update_option: update_without_changes
    excluded_target_languages: [en, ja, ko]
    labels: [hant-phrases]
